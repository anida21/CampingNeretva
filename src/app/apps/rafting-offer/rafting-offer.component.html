<div class="main">
    <div class="static-slider-head"
        style="background-image: url(assets/images/innerpage/activities.webp); position: relative; height: 60vh;">
        <!-- Promijenjena visina slike na 60vh -->
        <div class="container"
            style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%;">
            <!-- Stilovi za apsolutno pozicioniranje i centraliziranje -->
            <!-- Row  -->
            <div class="row justify-content-center">
                <!-- Column -->
                <div class="col-lg-9 col-md-6 align-self-center text-center no-trans">
                    <h1 class="titlegallery">RAFTING OFFERS</h1>
                </div>
                <!-- Column -->
            </div>
        </div>
    </div>
</div>
<div class="row justify-content-center">
    <!-- Column -->
    <div class="col-md-8 no-trans text-center"
        style="background-color: #f8f9fa; padding: 60px; margin-bottom: 0px; margin-top:60px">

        <h2 class="subtitle op-4" style="font-family: Kanit, sans-serif;">
            Dive into Excitement: Book Your Rafting Trip Today!
        </h2>
    </div>
</div>
<div class="offers-container">
    <div class="offer-card" *ngFor="let offer of offers">
        <div class="image-container">
            <img [src]="offer.image" alt="Rafting Offer Image" class="offer-image">
        </div>
        <div class="offer-info">
            <h3 class="offer-title">{{ offer.title }}</h3>
            <p class="offer-duration">
                <i class="fas fa-calendar-alt calendar-icon"></i>
                {{ offer.availability }}</p>
            <p class="offer-duration">
                <i class="fas fa-clock clock-icon"></i>
                {{ offer.duration }}</p>
        </div>
        <div class="offer-price-btn">
            <p class="offer-price">{{ offer.price }}</p>
            <a [routerLink]="['/rafting-detail']" class="details-button">View Details</a>
        </div>
    </div>
</div>
